[package]
name = "x11lock"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "x11lock"
path = "src/main.rs"

[dependencies]
x11rb = { version = "0.13", features = ["randr"] }
pam-client2 = "0.5"
nix = { version = "0.29", features = ["signal", "user"] }
anyhow = "1"
cairo-rs = { version = "0.20", features = ["png"] }
pangocairo = "0.20"
pango = "0.20"
zeroize = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
